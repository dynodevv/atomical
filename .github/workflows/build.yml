name: Build Atomical ISO

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc nasm xorriso mtools make git

      - name: Build ISO
        run: make

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: atomical-iso
          path: atomical.iso
